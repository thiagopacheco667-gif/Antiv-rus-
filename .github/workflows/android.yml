name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do backend
        working-directory: backend
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew --no-daemon :domain:test testDebugUnitTest

      - name: Lint e APK de debug
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Preparar assinatura de release
        env:
          KEYSTORE_B64: ${{ secrets.AEGIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aegis-release.jks"
            echo "AEGIS_KEYSTORE_PATH=$RUNNER_TEMP/aegis-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo AEGIS_KEYSTORE_B64 ausente: o APK de release será assinado com a chave de depuração."
          fi

      - name: APK de release (R8)
        env:
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publicar APK de release
        uses: actions/upload-artifact@v4
        with:
          name: aegis-security-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: aegis-security-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            core/database/schemas/
          if-no-files-found: ignore

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testes instrumentados (emulador API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew --no-daemon :core:database:connectedDebugAndroidTest
